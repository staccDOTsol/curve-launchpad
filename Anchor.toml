[toolchain]
anchor_version = "0.30.1"
# Use whatever cargo-build-sbf is on PATH (currently solana 3.1.15 / Agave
# stable). The previous pin to 1.18.17 forced anchor to switch toolchains
# to a version that isn't installed on this machine and broke `anchor build`.

[features]
resolution = true
skip-lint = false

[programs.localnet]
curve_launchpad = "GLstzf6zSDdU44K1GUCPKy9NyZx7qyUpb9L8qrXCrADo"

[programs.devnet]
curve_launchpad = "GLstzf6zSDdU44K1GUCPKy9NyZx7qyUpb9L8qrXCrADo"

[programs.mainnet]
curve_launchpad = "GLstzf6zSDdU44K1GUCPKy9NyZx7qyUpb9L8qrXCrADo"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.spec.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[[test.genesis]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
program = "metaplex_metadata.so"

[[test.genesis]]
address = "CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C"
program = "cp_amm.so"

[test.validator]
bind_address = "0.0.0.0"
url = "https://api.mainnet-beta.solana.com"
ledger = ".anchor/test-ledger"
rpc_port = 8899

[[test.validator.clone]]
address = "DNXgeM9EiiaAbaWvwjHj9fQQLAX5ZsfHyvmYUNRAdNC8"

[[test.validator.clone]]
address = "D4FPEruKEHrG5TenZ2mpDGEfu1iUvTiqBxvpU8HLBvC2"

# stacSOL LST quote mint — cloned so callers that hit `Global.quote_mint`
# while it still points at the on-chain constant (post-`initialize`, pre-
# `set_params` override) have the mint account available. The TS suite
# rotates `Global.quote_mint` to a local mock LST via `set_params` so the
# rest of the tests can transact in tokens we control; this clone is just
# a defence-in-depth so the constraint check in any pre-rotation ix path
# doesn't trip a missing-account error against a fresh ledger.
[[test.validator.clone]]
address = "6K4xdfEk5rvySM496rxm4x8AgC9wVt7N4C7mFFpNAj5f"
