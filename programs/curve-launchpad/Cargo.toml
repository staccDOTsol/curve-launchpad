[package]
name = "curve-launchpad"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "curve_launchpad"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = {version="0.30.1", features = ["init-if-needed", "event-cpi"]}
anchor-spl = { version = "0.30.1", features = ["metadata", "token", "token_2022", "token_2022_extensions"] }
spl-token-2022 = "3.0"
switchboard-on-demand = { version = "0.3", default-features = false }
# switchboard's solana-clock 2.x is incompatible with anchor 0.30.1's
# solana-program 1.18.x Clock — we re-export the 2.x Clock to build the
# argument the switchboard API expects from our anchor-side Sysvar read.
solana-clock = "2.2"
# Pin borsh to 0.10 so anchor-lang's `>=0.9,<0.11` range resolves there
# (otherwise switchboard's transitive deps can flip it to 0.9 and break
# anchor-derive-serde's `deserialize_reader` codegen).
borsh = "0.10"
